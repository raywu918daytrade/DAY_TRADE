name: Update M1 Training Data

on:
  schedule:
    # 每天 18:00 台北時間（= 10:00 UTC），週一到週五（收盤後約 5 小時）
    - cron: '0 10 * * 1-5'
  workflow_dispatch:   # 允許手動觸發

jobs:
  update:
    runs-on: ubuntu-latest
    environment: DAY_TRADE
    timeout-minutes: 150   # 2787支 × 2.1s ≈ 97分鐘，加緩衝

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt huggingface_hub

      - name: Download m1 and push to HF Hub
        env:
          FUGLE: ${{ secrets.FUGLE }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: ${{ vars.HF_REPO_ID }}
        run: python scripts/push_m1_to_hf.py
